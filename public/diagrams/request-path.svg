<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-label="One request through the test site" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/></marker></defs>
<rect width="900" height="720" rx="12" fill="#12161f"/>
<text x="24" y="34" fill="#e8ebf2" font-size="18" font-weight="600">One request through the test site</text>
<text x="24" y="56" fill="#9aa4b8" font-size="12">Every request on every host takes this path. Failures are red. Nothing here blocks on a signature.</text>
<rect x="180" y="84" width="300" height="56" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="330" y="104" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Request arrives</text><text x="330" y="120" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Host, headers, IP, user agent</text>
<rect x="180" y="172" width="300" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="330" y="192" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Read the host name</text><text x="330" y="208" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">&lt;run token&gt;.&lt;variant&gt;.&lt;domain&gt;</text>
<rect x="180" y="260" width="300" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="330" y="280" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Check the signature</text><text x="330" y="296" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">valid, unknown key, invalid, absent</text>
<rect x="180" y="348" width="300" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="330" y="368" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Route by variant</text><text x="330" y="384" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">page, MCP call, OAuth, key directory</text>
<rect x="180" y="436" width="300" height="56" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="330" y="456" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Label the client</text><text x="330" y="472" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">claimed agent, verified or not</text>
<rect x="180" y="524" width="300" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="330" y="544" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Write one log line</text><text x="330" y="560" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">token, ip, user agent, signature, tool, oauth</text>
<rect x="180" y="612" width="300" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="330" y="632" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">On the laptop: match by token</text><text x="330" y="648" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">run lines to runs, tokenless lines to strangers</text>
<path d="M330,140 V172" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M330,228 V260" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M330,316 V348" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M330,404 V436" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M330,492 V524" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M330,580 V612" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="640" y="172" width="230" height="56" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/><text x="755" y="192" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Unknown host</text><text x="755" y="208" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">421, not logged</text>
<path d="M480,200 H640" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="495" y="192" fill="#9aa4b8" font-size="11">no match</text>
<rect x="640" y="308" width="230" height="50" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/><text x="755" y="325" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Poisoned tools, no token</text><text x="755" y="341" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">404</text>
<rect x="640" y="370" width="230" height="50" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/><text x="755" y="387" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Protected page, no token</text><text x="755" y="403" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">401 with a sign-in link</text>
<path d="M480,368 H640" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="640" y="612" width="230" height="56" rx="6" fill="#14532d" stroke="#86efac" stroke-width="1.5"/><text x="755" y="632" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Run table and</text><text x="755" y="648" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">identity matrix</text>
<path d="M480,640 H640" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="24" y="690" width="14" height="14" rx="3" fill="#1e3a8a" stroke="#93c5fd"/><text x="44" y="701" fill="#9aa4b8" font-size="11">new in this project</text><rect x="174" y="690" width="14" height="14" rx="3" fill="#2a3140" stroke="#7c869a"/><text x="194" y="701" fill="#9aa4b8" font-size="11">plain step</text><rect x="324" y="690" width="14" height="14" rx="3" fill="#7f1d1d" stroke="#fca5a5"/><text x="344" y="701" fill="#9aa4b8" font-size="11">failure path</text><rect x="474" y="690" width="14" height="14" rx="3" fill="#14532d" stroke="#86efac"/><text x="494" y="701" fill="#9aa4b8" font-size="11">output</text>
</svg>
