<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Four outcomes from two questions: good context and good answer works; good context and bad answer is a generation failure; bad context and good answer is a suspicious pass; bad context and bad answer is a retrieval failure, or a knowledge gap if the document does not exist" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/></marker></defs>
<rect width="900" height="700" rx="12" fill="#12161f"/>
<text x="24" y="34" fill="#e8ebf2" font-size="18" font-weight="600" text-anchor="start">Two questions, four outcomes</text>
<text x="24" y="56" fill="#9aa4b8" font-size="12" font-weight="400" text-anchor="start">Score retrieval and the answer separately. Each cell points to a different fix.</text>
<text x="360" y="100" fill="#9aa4b8" font-size="13" font-weight="600" text-anchor="middle">Answer good</text>
<text x="690" y="100" fill="#9aa4b8" font-size="13" font-weight="600" text-anchor="middle">Answer bad</text>
<text x="360" y="82" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="start">Question 2: given that context, is the answer right?</text>
<rect x="20" y="150" width="170" height="170" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="105.0" y="209.5" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Context good</text>
<text x="105.0" y="226.5" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">Question 1: did</text>
<text x="105.0" y="243.5" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">retrieval find what</text>
<text x="105.0" y="260.5" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">was needed?</text>
<rect x="20" y="330" width="170" height="170" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="105.0" y="389.5" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Context bad</text>
<text x="105.0" y="406.5" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">The needed information</text>
<text x="105.0" y="423.5" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">is not in the retrieved</text>
<text x="105.0" y="440.5" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">chunks.</text>
<rect x="200" y="150" width="320" height="170" rx="6" fill="#14532d" stroke="#86efac" stroke-width="1.5"/>
<text x="360.0" y="235.0" fill="#e8ebf2" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central">Working as intended</text>
<rect x="530" y="150" width="320" height="170" rx="6" fill="#5b1a1f" stroke="#f1857f" stroke-width="1.5"/>
<text x="690.0" y="201.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Generation failure</text>
<text x="690.0" y="218.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">The context had it, the answer did not.</text>
<text x="690.0" y="235.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">Look at: the prompt, the model,</text>
<text x="690.0" y="252.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">how much context you pass in, and</text>
<text x="690.0" y="269.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">whether it must stick to its sources.</text>
<rect x="200" y="330" width="320" height="170" rx="6" fill="#5a3d0a" stroke="#fbbf24" stroke-width="1.5"/>
<text x="360.0" y="381.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Suspicious pass</text>
<text x="360.0" y="398.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">The model answered from what it</text>
<text x="360.0" y="415.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">already knew, not from your documents.</text>
<text x="360.0" y="432.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">Count these separately. A rising</text>
<text x="360.0" y="449.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">number means the system leans on luck.</text>
<rect x="530" y="330" width="320" height="170" rx="6" fill="#5b1a1f" stroke="#f1857f" stroke-width="1.5"/>
<text x="690.0" y="381.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Retrieval failure</text>
<text x="690.0" y="398.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">The context never had it.</text>
<text x="690.0" y="415.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">No prompt change fixes this. Look at:</text>
<text x="690.0" y="432.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">chunking, embeddings, the index,</text>
<text x="690.0" y="449.0" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">query rewriting, ranking, freshness.</text>
<path d="M690 500 V540" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="200" y="540" width="650" height="110" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
<text x="525.0" y="569.5" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Knowledge gap</text>
<text x="525.0" y="586.5" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">Some questions have no answer in the corpus. Retrieval returns its best guess, which is wrong,</text>
<text x="525.0" y="603.5" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">so the query looks like a retrieval failure. Tuning the retriever will not help.</text>
<text x="525.0" y="620.5" fill="#e8ebf2" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">The content owner fixes it: write the missing document.</text>
</svg>
