<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="The live request path on Render. A question meets the Jev guard. Unsafe questions are refused there, with no call to Gemini or Qdrant, and that path kept working while Gemini failed. Safe questions go to the Jev router, then to retrieval from Qdrant Cloud and to Gemini, which writes the answer. A greeting skips retrieval. Six numbered faults are marked where they happened: retired model names, depleted Gemini credits and a key from the wrong project at Gemini, an unreachable cluster and a lost collection size at Qdrant, and the Jev default at the guard and router." font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/></marker></defs>
<rect width="900" height="640" rx="12" fill="#12161f"/>
<text x="24" y="34" fill="#e8ebf2" font-size="18" font-weight="600">Where the live app broke, and what kept working</text>
<text x="24" y="56" fill="#9aa4b8" font-size="11" text-anchor="start">Numbers mark the six faults from the deployment on 2026-11-18.</text>
<rect x="350" y="84" width="200" height="40" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="450.0" y="104.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">A question arrives</text>
<rect x="330" y="150" width="240" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="450.0" y="169.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Guard on Jev</text><text x="450.0" y="187.0" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">SAFE, OFF_TOPIC or INJECTION</text>
<circle cx="570" cy="150" r="10" fill="#f59e0b"/><text x="570" y="150" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text>
<path d="M450 124 V150" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="670" y="150" width="200" height="56" rx="6" fill="#5b1a1f" stroke="#f1857f" stroke-width="1.5"/><text x="770.0" y="169.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Refuse with one short message</text><text x="770.0" y="187.0" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">No Gemini or Qdrant call</text>
<path d="M570 178 H670" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<text x="620" y="170" fill="#9aa4b8" font-size="11" text-anchor="middle">not safe</text>
<text x="770" y="226" fill="#86efac" font-size="11" text-anchor="middle">Kept working while Gemini failed</text>
<text x="770" y="242" fill="#86efac" font-size="11" text-anchor="middle">0.4 to 0.5 s in total</text>
<rect x="330" y="260" width="240" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="450.0" y="279.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Router on Jev</text><text x="450.0" y="297.0" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">LOOKUP, SUMMARY or CHAT</text>
<circle cx="570" cy="260" r="10" fill="#f59e0b"/><text x="570" y="260" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text>
<path d="M450 206 V260" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<text x="466" y="238" fill="#9aa4b8" font-size="11" text-anchor="start">SAFE</text>
<rect x="290" y="346" width="320" height="260" rx="10" fill="none" stroke="#7c869a" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="302" y="364" fill="#9aa4b8" font-size="11" text-anchor="start">Needed only to answer</text>
<rect x="350" y="388" width="200" height="56" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="450.0" y="407.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Retrieve from Qdrant Cloud</text><text x="450.0" y="425.0" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">86 chunks, 5 documents</text>
<circle cx="526" cy="388" r="10" fill="#f59e0b"/><text x="526" y="388" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<circle cx="552" cy="388" r="10" fill="#f59e0b"/><text x="552" y="388" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
<rect x="350" y="500" width="200" height="56" rx="6" fill="#14532d" stroke="#86efac" stroke-width="1.5"/><text x="450.0" y="528.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Gemini writes the answer</text>
<circle cx="500" cy="500" r="10" fill="#f59e0b"/><text x="500" y="500" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="526" cy="500" r="10" fill="#f59e0b"/><text x="526" y="500" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<circle cx="552" cy="500" r="10" fill="#f59e0b"/><text x="552" y="500" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<path d="M450 316 V388" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<text x="466" y="336" fill="#9aa4b8" font-size="11" text-anchor="start">LOOKUP or SUMMARY</text>
<path d="M450 444 V500" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M330 288 H200 V528 H350" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<text x="210" y="420" fill="#9aa4b8" font-size="11" text-anchor="start">CHAT skips</text>
<text x="210" y="436" fill="#9aa4b8" font-size="11" text-anchor="start">retrieval</text>
<text x="640" y="290" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="start">What broke, in order</text>
<circle cx="650" cy="320" r="10" fill="#f59e0b"/><text x="650" y="320" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<text x="668" y="324" fill="#e8ebf2" font-size="11" text-anchor="start">Retired model names, 503</text>
<circle cx="650" cy="352" r="10" fill="#f59e0b"/><text x="650" y="352" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<text x="668" y="356" fill="#e8ebf2" font-size="11" text-anchor="start">Gemini 429, credits depleted</text>
<circle cx="650" cy="384" r="10" fill="#f59e0b"/><text x="650" y="384" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text x="668" y="388" fill="#e8ebf2" font-size="11" text-anchor="start">Key from a different project</text>
<circle cx="650" cy="416" r="10" fill="#f59e0b"/><text x="650" y="416" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text x="668" y="420" fill="#e8ebf2" font-size="11" text-anchor="start">Qdrant cluster refused connections</text>
<circle cx="650" cy="448" r="10" fill="#f59e0b"/><text x="650" y="448" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
<text x="668" y="452" fill="#e8ebf2" font-size="11" text-anchor="start">Collection size lost on restart</text>
<circle cx="650" cy="480" r="10" fill="#f59e0b"/><text x="650" y="480" fill="#12161f" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text>
<text x="668" y="484" fill="#e8ebf2" font-size="11" text-anchor="start">Guard and router default to Jev</text>
</svg>
