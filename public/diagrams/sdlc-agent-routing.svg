<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-label="One webhook and one orchestrator route GitLab events to four agents: merge request opened runs Security then Compliance, reviewer assigned runs Compliance, pipeline failed runs Insight, weekly schedule or manual call runs Digest, and any other event is ignored with a clear response." font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/></marker></defs>
<rect width="900" height="650" rx="12" fill="#12161f"/>
<text x="24" y="34" fill="#e8ebf2" font-size="18" font-weight="600" text-anchor="start">Four agents, one webhook</text>
<text x="24" y="56" fill="#9aa4b8" font-size="12" font-weight="400" text-anchor="start">The orchestrator is a plain if/else on the event name. There is no agent framework.</text>
<rect x="300" y="84" width="300" height="40" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="450.0" y="104.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">GitLab sends an event</text>
<rect x="300" y="150" width="300" height="40" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="450.0" y="170.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Webhook checks GitLab&#x27;s secret token</text>
<rect x="250" y="216" width="400" height="44" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="450.0" y="230.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Turn the event into a small context</text>
<text x="450.0" y="246.0" fill="#e8ebf2" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">Project, merge request, pipeline</text>
<rect x="300" y="286" width="300" height="40" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
<text x="450.0" y="306.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">Orchestrator picks the agents</text>
<path d="M450 124 V150" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M450 190 V216" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M450 260 V286" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M450 326 V360" fill="none" stroke="#8a94a6" stroke-width="1.5"/>
<path d="M98 360 H802" fill="none" stroke="#8a94a6" stroke-width="1.5"/>
<path d="M98 360 V390" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="18" y="390" width="160" height="50" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="98.0" y="415.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Merge request opened</text>
<path d="M98 440 V480" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="18" y="480" width="160" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
<text x="98.0" y="500.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Security,</text>
<text x="98.0" y="516.0" fill="#e8ebf2" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">then Compliance</text>
<path d="M274 360 V390" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="194" y="390" width="160" height="50" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="274.0" y="415.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Reviewer assigned</text>
<path d="M274 440 V480" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="194" y="480" width="160" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
<text x="274.0" y="508.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Compliance</text>
<path d="M450 360 V390" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="370" y="390" width="160" height="50" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="450.0" y="415.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Pipeline failed</text>
<path d="M450 440 V480" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="370" y="480" width="160" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
<text x="450.0" y="508.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Insight</text>
<path d="M626 360 V390" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="546" y="390" width="160" height="50" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="626.0" y="407.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Weekly schedule</text>
<text x="626.0" y="423.0" fill="#e8ebf2" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">or manual call</text>
<path d="M626 440 V480" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="546" y="480" width="160" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
<text x="626.0" y="508.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Digest</text>
<path d="M802 360 V390" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="722" y="390" width="160" height="50" rx="6" fill="#5b1a1f" stroke="#f1857f" stroke-width="1.5"/>
<text x="802.0" y="415.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Any other event</text>
<path d="M802 440 V480" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="722" y="480" width="160" height="56" rx="6" fill="#5b1a1f" stroke="#f1857f" stroke-width="1.5"/>
<text x="802.0" y="500.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Ignored, with a</text>
<text x="802.0" y="516.0" fill="#e8ebf2" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">clear response</text>
<rect x="60" y="576" width="780" height="56" rx="6" fill="#5a3d0a" stroke="#fbbf24" stroke-width="1.5"/>
<text x="450.0" y="596.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Each agent run is wrapped in a try/except</text>
<text x="450.0" y="612.0" fill="#e8ebf2" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">If one agent crashes, the others still run. The failure comes back as an error entry.</text>
</svg>
