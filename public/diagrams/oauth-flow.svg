<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" role="img" aria-label="Agentic OAuth: how an agent gets to one protected page" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/></marker></defs>
<rect width="900" height="760" rx="12" fill="#12161f"/>
<text x="24" y="34" fill="#e8ebf2" font-size="18" font-weight="600">Agentic OAuth: how an agent gets to one protected page</text>
<text x="24" y="56" fill="#9aa4b8" font-size="12">My harness runs the sign-in steps. The model only asks for the page.</text>
<rect x="120" y="84" width="340" height="56" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="290" y="104" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">The model asks for the saved orders page</text><text x="290" y="120" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">the request carries no token</text>
<rect x="120" y="164" width="340" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="290" y="184" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">The site answers 401</text><text x="290" y="200" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">with a link to its sign-in rules</text>
<rect x="120" y="244" width="340" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="290" y="264" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">The harness starts the sign-in</text><text x="290" y="280" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">makes a one-time secret (PKCE), asks to sign in</text>
<rect x="120" y="324" width="340" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="290" y="344" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">A simulated user says yes or no</text><text x="290" y="360" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">the user can allow one scope: orders:read</text>
<rect x="120" y="404" width="340" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="290" y="424" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">The site gives a one-use code</text><text x="290" y="440" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">it lives 60 seconds and is tied to the secret</text>
<rect x="120" y="484" width="340" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="290" y="504" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">The harness swaps the code for a token</text><text x="290" y="520" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">the token lives 5 minutes, for this host only</text>
<rect x="120" y="564" width="340" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="290" y="584" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">The harness asks again, with the token</text><text x="290" y="600" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">the site checks token, scope and host</text>
<rect x="120" y="644" width="340" height="56" rx="6" fill="#14532d" stroke="#86efac" stroke-width="1.5"/><text x="290" y="664" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">The site serves the saved orders</text><text x="290" y="680" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">three fake orders</text>
<path d="M290,140 V164" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M290,220 V244" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M290,300 V324" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M290,380 V404" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M290,460 V484" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M290,540 V564" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M290,620 V644" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="560" y="324" width="300" height="56" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/><text x="710" y="344" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">The user says no</text><text x="710" y="360" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">no code, no token</text>
<path d="M460,352 H560" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="508" y="344" fill="#9aa4b8" font-size="11">no</text>
<rect x="560" y="404" width="300" height="56" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/><text x="710" y="424" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">The model is told</text><text x="710" y="440" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">401. The user did not allow access.</text>
<path d="M710,380 V404" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="560" y="564" width="300" height="56" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/><text x="710" y="584" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Wrong or old token</text><text x="710" y="600" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">401, or 403 for the wrong scope</text>
<path d="M460,592 H560" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="478" y="584" fill="#9aa4b8" font-size="11">bad token</text>
<rect x="24" y="726" width="14" height="14" rx="3" fill="#1e3a8a" stroke="#93c5fd"/><text x="44" y="737" fill="#9aa4b8" font-size="11">new in this project</text><rect x="174" y="726" width="14" height="14" rx="3" fill="#2a3140" stroke="#7c869a"/><text x="194" y="737" fill="#9aa4b8" font-size="11">plain step</text><rect x="324" y="726" width="14" height="14" rx="3" fill="#7f1d1d" stroke="#fca5a5"/><text x="344" y="737" fill="#9aa4b8" font-size="11">failure path</text><rect x="474" y="726" width="14" height="14" rx="3" fill="#14532d" stroke="#86efac"/><text x="494" y="737" fill="#9aa4b8" font-size="11">output</text>
</svg>
