<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="The assistant builds one fresh block of context on every call from five layers in a fixed order: identity, durable memory, goals, retrieved notes, and recent activity. It sends one model call and prints a short plain-text answer. There is no saved conversation." font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/></marker></defs>
<rect width="900" height="700" rx="12" fill="#12161f"/>
<text x="24" y="34" fill="#e8ebf2" font-size="18" font-weight="600" text-anchor="start">Rebuild the context on every call</text>
<text x="24" y="56" fill="#9aa4b8" font-size="12" font-weight="400" text-anchor="start">Five layers, one fixed order, one model call. Each layer has one job.</text>
<rect x="160" y="84" width="580" height="52" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="450.0" y="102.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Identity</text>
<text x="450.0" y="118.0" fill="#e8ebf2" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">Who I am, my active projects, my goals. Always in compact form.</text>
<rect x="160" y="148" width="580" height="52" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="450.0" y="166.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Durable memory</text>
<text x="450.0" y="182.0" fill="#e8ebf2" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">Stable facts and recurring context. Always included.</text>
<rect x="160" y="212" width="580" height="52" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="450.0" y="230.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Goals</text>
<text x="450.0" y="246.0" fill="#e8ebf2" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">A plain list I edit. Always included.</text>
<rect x="160" y="276" width="580" height="52" rx="6" fill="#5a3d0a" stroke="#fbbf24" stroke-width="1.5"/>
<text x="450.0" y="294.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Retrieved notes</text>
<text x="450.0" y="310.0" fill="#e8ebf2" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">Keyword-matched passages. Only when a query asks for them.</text>
<rect x="160" y="340" width="580" height="52" rx="6" fill="#5a3d0a" stroke="#fbbf24" stroke-width="1.5"/>
<text x="450.0" y="358.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">Recent activity</text>
<text x="450.0" y="374.0" fill="#e8ebf2" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="central">Git, journal, notes apps, other tools. Only when a command opts in.</text>
<path d="M450 396 V424" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="160" y="424" width="580" height="44" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
<text x="450.0" y="446.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">One block of context, assembled in this order on every call</text>
<path d="M450 468 V496" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="300" y="496" width="300" height="40" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/>
<text x="450.0" y="516.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">One model call</text>
<path d="M450 536 V564" fill="none" stroke="#8a94a6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="300" y="564" width="300" height="40" rx="6" fill="#14532d" stroke="#86efac" stroke-width="1.5"/>
<text x="450.0" y="584.0" fill="#e8ebf2" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central">A short plain-text answer</text>
<rect x="160" y="630" width="580" height="44" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/>
<text x="450.0" y="652.0" fill="#e8ebf2" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central">No chat server, no saved conversation, no database for the assistant&#x27;s own state</text>
</svg>
