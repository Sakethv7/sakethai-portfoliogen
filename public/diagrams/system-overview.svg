<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-label="System overview: who talks to the test site" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/></marker></defs>
<rect width="1000" height="660" rx="12" fill="#12161f"/>
<text x="24" y="34" fill="#e8ebf2" font-size="18" font-weight="600">System overview: who talks to the test site</text>
<text x="24" y="56" fill="#9aa4b8" font-size="12">One laptop, one small cloud VM, one domain. Cloud agents come from Anthropic&#x27;s servers. The local model comes from the laptop.</text>
<rect x="20" y="76" width="300" height="500" rx="10" fill="#1a2030" stroke="#2f384b" stroke-width="1.5"/><text x="34" y="98" fill="#9aa4b8" font-size="12" font-weight="600" letter-spacing="0.5">LAPTOP</text>
<rect x="40" y="110" width="260" height="70" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="170" y="137" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Runner</text><text x="170" y="153" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">picks a cell, mints a run token</text>
<rect x="40" y="220" width="260" height="70" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="170" y="247" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Local model</text><text x="170" y="263" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Qwen3-8B on llama.cpp</text>
<rect x="40" y="330" width="260" height="80" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="170" y="354" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Harness</text><text x="170" y="370" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">fetch tool, MCP client,</text><text x="170" y="386" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">signs requests, runs OAuth</text>
<rect x="40" y="480" width="260" height="70" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="170" y="507" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Reports</text><text x="170" y="523" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">results, summary, identity tables</text>
<rect x="370" y="76" width="250" height="220" rx="10" fill="#1a2030" stroke="#2f384b" stroke-width="1.5"/><text x="384" y="98" fill="#9aa4b8" font-size="12" font-weight="600" letter-spacing="0.5">ANTHROPIC SERVERS</text>
<rect x="390" y="112" width="210" height="60" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="495" y="134" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Claude with the</text><text x="495" y="150" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">web fetch tool</text>
<rect x="390" y="200" width="210" height="70" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="495" y="227" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Claude with the</text><text x="495" y="243" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">MCP connector</text>
<rect x="370" y="500" width="250" height="76" rx="10" fill="#1a2030" stroke="#2f384b" stroke-width="1.5"/><text x="384" y="522" fill="#9aa4b8" font-size="12" font-weight="600" letter-spacing="0.5">CLOUDFLARE DNS</text>
<rect x="390" y="530" width="210" height="34" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="495" y="547" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">5 names + 4 wildcards, DNS only</text>
<rect x="670" y="76" width="310" height="500" rx="10" fill="#1a2030" stroke="#2f384b" stroke-width="1.5"/><text x="684" y="98" fill="#9aa4b8" font-size="12" font-weight="600" letter-spacing="0.5">VM: GCP E2-MICRO, 1 GB</text>
<rect x="690" y="112" width="270" height="54" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="825" y="131" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Caddy</text><text x="825" y="147" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">HTTPS, 4 wildcard certificates</text>
<rect x="690" y="196" width="270" height="262" rx="10" fill="#1a2030" stroke="#2f384b" stroke-width="1.5"/><text x="704" y="218" fill="#9aa4b8" font-size="12" font-weight="600" letter-spacing="0.5"></text>
<text x="705" y="216" fill="#9aa4b8" font-size="12" font-weight="600">TEST SITE: ONE PROCESS</text>
<rect x="706" y="232" width="115" height="40" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="763.5" y="252" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">legacy</text>
<rect x="831" y="232" width="115" height="40" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="888.5" y="252" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ai</text>
<rect x="706" y="284" width="115" height="40" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="763.5" y="304" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">native: MCP tools</text>
<rect x="831" y="284" width="115" height="40" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="888.5" y="304" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">account: OAuth page</text>
<rect x="706" y="336" width="115" height="40" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="763.5" y="356" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">bot: key directory</text>
<rect x="706" y="396" width="240" height="40" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="826" y="416" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">signature check, then log line</text>
<rect x="690" y="482" width="270" height="54" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="825" y="501" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Request log</text><text x="825" y="517" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">one JSON line per request</text>
<path d="M300,145 H390" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="332" y="138" fill="#9aa4b8" font-size="11">API</text>
<path d="M170,180 V220" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="178" y="204" fill="#9aa4b8" font-size="11">local arm</text>
<path d="M170,290 V330" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M300,372 H650 V139 H690" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="450" y="364" fill="#9aa4b8" font-size="11">HTTPS, run host per run</text>
<path d="M620,160 L690,139" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="636" y="134" fill="#9aa4b8" font-size="11">HTTPS</text>
<path d="M825,166 V196" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M825,458 V482" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M690,509 H330 V515 H300" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="360" y="501" fill="#9aa4b8" font-size="11">gcloud scp after the runs</text>
<path d="M620,547 H670" fill="none" stroke="#8a94a6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="374" y="592" fill="#9aa4b8" font-size="11">DNS names point to the VM IP</text>
<rect x="24" y="622" width="14" height="14" rx="3" fill="#1e3a8a" stroke="#93c5fd"/><text x="44" y="633" fill="#9aa4b8" font-size="11">new in this project</text><rect x="174" y="622" width="14" height="14" rx="3" fill="#2a3140" stroke="#7c869a"/><text x="194" y="633" fill="#9aa4b8" font-size="11">exists outside it</text>
</svg>
