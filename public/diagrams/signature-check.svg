<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" role="img" aria-label="Signed requests: how the site checks who is calling" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/></marker></defs>
<rect width="900" height="780" rx="12" fill="#12161f"/>
<text x="24" y="34" fill="#e8ebf2" font-size="18" font-weight="600">Signed requests: how the site checks who is calling</text>
<text x="24" y="56" fill="#9aa4b8" font-size="12">The site records a verdict for every signed request. It never blocks. The page is served either way.</text>
<rect x="120" y="84" width="340" height="56" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="290" y="104" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">A request arrives</text><text x="290" y="120" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">it may carry three signature headers</text>
<rect x="120" y="170" width="340" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="290" y="190" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Is the agent address safe?</text><text x="290" y="206" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">https, a public host, no redirects</text>
<rect x="120" y="256" width="340" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="290" y="276" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Fetch the agent&#x27;s key directory</text><text x="290" y="292" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">kept for 5 minutes</text>
<rect x="120" y="342" width="340" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="290" y="362" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Is the key in the directory?</text><text x="290" y="378" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">the key id is a hash of the public key</text>
<rect x="120" y="428" width="340" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="290" y="448" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Is the signature still fresh?</text><text x="290" y="464" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">created and expires times</text>
<rect x="120" y="514" width="340" height="56" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="290" y="534" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Does the signature match the request?</text><text x="290" y="550" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Ed25519, over the host and the agent address</text>
<rect x="120" y="600" width="340" height="56" rx="6" fill="#14532d" stroke="#86efac" stroke-width="1.5"/><text x="290" y="620" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Record: valid</text><text x="290" y="636" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">then serve the page</text>
<path d="M290,140 V170" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M290,226 V256" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="296" y="242" fill="#9aa4b8" font-size="11">yes</text>
<path d="M290,312 V342" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="296" y="328" fill="#9aa4b8" font-size="11">yes</text>
<path d="M290,398 V428" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="296" y="414" fill="#9aa4b8" font-size="11">yes</text>
<path d="M290,484 V514" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="296" y="500" fill="#9aa4b8" font-size="11">yes</text>
<path d="M290,570 V600" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="296" y="586" fill="#9aa4b8" font-size="11">yes</text>
<rect x="560" y="84" width="300" height="56" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="710" y="104" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">No signature headers</text><text x="710" y="120" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">no verdict, serve the page</text>
<path d="M460,112 H560" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="490" y="104" fill="#9aa4b8" font-size="11">none</text>
<rect x="560" y="170" width="300" height="56" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/><text x="710" y="190" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Record: invalid</text><text x="710" y="206" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">serve the page</text>
<path d="M460,198 H560" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="508" y="190" fill="#9aa4b8" font-size="11">no</text>
<rect x="560" y="256" width="300" height="56" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/><text x="710" y="276" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Record: directory unreachable</text><text x="710" y="292" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">serve the page</text>
<path d="M460,284 H560" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="498" y="276" fill="#9aa4b8" font-size="11">fails</text>
<rect x="560" y="342" width="300" height="56" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/><text x="710" y="362" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Record: unknown key</text><text x="710" y="378" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">a spoofer lands here</text>
<path d="M460,370 H560" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="508" y="362" fill="#9aa4b8" font-size="11">no</text>
<rect x="560" y="428" width="300" height="56" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/><text x="710" y="448" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Record: expired</text><text x="710" y="464" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">serve the page</text>
<path d="M460,456 H560" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="508" y="448" fill="#9aa4b8" font-size="11">no</text>
<rect x="560" y="514" width="300" height="56" rx="6" fill="#7f1d1d" stroke="#fca5a5" stroke-width="1.5"/><text x="710" y="534" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">Record: invalid</text><text x="710" y="550" fill="#e8ebf2" font-size="12" text-anchor="middle" dominant-baseline="central">serve the page</text>
<path d="M460,542 H560" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="508" y="534" fill="#9aa4b8" font-size="11">no</text>
<rect x="24" y="748" width="14" height="14" rx="3" fill="#1e3a8a" stroke="#93c5fd"/><text x="44" y="759" fill="#9aa4b8" font-size="11">new in this project</text><rect x="174" y="748" width="14" height="14" rx="3" fill="#2a3140" stroke="#7c869a"/><text x="194" y="759" fill="#9aa4b8" font-size="11">plain step</text><rect x="324" y="748" width="14" height="14" rx="3" fill="#7f1d1d" stroke="#fca5a5"/><text x="344" y="759" fill="#9aa4b8" font-size="11">not verified</text><rect x="474" y="748" width="14" height="14" rx="3" fill="#14532d" stroke="#86efac"/><text x="494" y="759" fill="#9aa4b8" font-size="11">verified</text>
</svg>
