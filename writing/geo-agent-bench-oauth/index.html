        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}

    </script>

    <!-- Old links look like /#/writing/x?section=y. Rewrite them to /writing/x/?section=y before React starts (ADR-047). -->

      (function () {
        var h = location.hash;
        if (h.indexOf('#/') !== 0) return;
        var rest = h.slice(2), q = rest.indexOf('?');
        var path = (q < 0 ? rest : rest.slice(0, q)).replace(/\/+$/, '');
        history.replaceState(null, '', '/sakethai-portfoliogen/' + (path ? path + '/' : '') + (q < 0 ? '' : rest.slice(q)));
      })();
    </script>
