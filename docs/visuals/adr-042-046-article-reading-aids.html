<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADR-042 to 046 explainer: article reading aids</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111418; --muted: #5b6470; --line: #6b7280;
    --grey-fill: #eceff3; --grey-stroke: #8b94a1;
    --blue-fill: #dbeafe; --blue-stroke: #1d4ed8;
    --red-fill: #fde2e4; --red-stroke: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --fg: #e8ebf0; --muted: #9aa4b2; --line: #8b94a1;
      --grey-fill: #1f2530; --grey-stroke: #6b7686;
      --blue-fill: #12294f; --blue-stroke: #6ea8fe;
      --red-fill: #4a1a1f; --red-stroke: #f1857f;
    }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .key { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 12px; font-size: 14px; }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; display: inline-block; }
  .k-grey i { background: var(--grey-fill); border-color: var(--grey-stroke); }
  .k-blue i { background: var(--blue-fill); border-color: var(--blue-stroke); }
  .k-red i { background: var(--red-fill); border-color: var(--red-stroke); }
  svg { width: 100%; height: auto; display: block; }
  .box { stroke-width: 2; }
  .grey { fill: var(--grey-fill); stroke: var(--grey-stroke); }
  .blue { fill: var(--blue-fill); stroke: var(--blue-stroke); }
  .red { fill: var(--red-fill); stroke: var(--red-stroke); }
  text { fill: var(--fg); font: 14px system-ui, sans-serif; text-anchor: middle; }
  .lbl { fill: var(--muted); font-size: 13px; }
  .edge { stroke: var(--line); stroke-width: 2; fill: none; }
  .head { fill: var(--line); }
</style>
</head>
<body>
<main>
  <h1>ADR-042 to 046: reading aids on a note page</h1>
  <p>Read from the top. A reader opens a note. Each blue step is new. Red steps end quietly or show the Not found page.</p>
  <div class="key">
    <span class="k-grey"><i></i>Exists today</span>
    <span class="k-blue"><i></i>New or changed</span>
    <span class="k-red"><i></i>Failure or empty path</span>
  </div>
  <svg viewBox="0 0 800 1090" role="img" aria-label="Flowchart of a note page after the reading aids: load, parse once, contents list, section scroll, body, end links">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
    </defs>

    <!-- main column, cx=300 -->
    <rect class="box grey" x="150" y="20" width="300" height="44" rx="8"/><text x="300" y="47">Reader opens a note</text>
    <rect class="box grey" x="150" y="100" width="300" height="44" rx="8"/><text x="300" y="127">Load the Markdown file</text>
    <polygon class="box grey" points="300,180 450,215 300,250 150,215"/><text x="300" y="220">File found?</text>
    <rect class="box blue" x="150" y="286" width="300" height="44" rx="8"/><text x="300" y="313">Parse once: ids, headings, minutes</text>
    <rect class="box blue" x="150" y="366" width="300" height="44" rx="8"/><text x="300" y="393">Show header, folded on phone</text>
    <polygon class="box blue" points="300,446 450,481 300,516 150,481"/><text x="300" y="486">3 or more headings?</text>
    <rect class="box blue" x="150" y="552" width="300" height="44" rx="8"/><text x="300" y="579">Show contents, side or folded</text>
    <polygon class="box blue" points="300,650 450,685 300,720 150,685"/><text x="300" y="690">Address names a heading?</text>
    <rect class="box blue" x="150" y="756" width="300" height="44" rx="8"/><text x="300" y="783">Scroll to that heading</text>
    <rect class="box blue" x="150" y="836" width="300" height="44" rx="8"/><text x="300" y="863">Show body, progress bar, table fades</text>
    <polygon class="box blue" points="300,916 450,951 300,986 150,951"/><text x="300" y="956">Another published note?</text>
    <rect class="box blue" x="150" y="1022" width="300" height="44" rx="8"/><text x="300" y="1049">Show next note or two more</text>

    <!-- right column, cx=650 -->
    <rect class="box red" x="530" y="193" width="240" height="44" rx="8"/><text x="650" y="220">Show the Not found page</text>
    <rect class="box blue" x="530" y="459" width="240" height="44" rx="8"/><text x="650" y="486">Skip the contents list</text>
    <rect class="box red" x="530" y="663" width="240" height="44" rx="8"/><text x="650" y="690">Stay at the top, no error</text>
    <rect class="box red" x="530" y="929" width="240" height="44" rx="8"/><text x="650" y="956">Hide the end links</text>

    <!-- edges, main -->
    <path class="edge" marker-end="url(#a)" d="M300 64V100"/>
    <path class="edge" marker-end="url(#a)" d="M300 144V180"/>
    <path class="edge" marker-end="url(#a)" d="M300 250V286"/>
    <path class="edge" marker-end="url(#a)" d="M300 330V366"/>
    <path class="edge" marker-end="url(#a)" d="M300 410V446"/>
    <path class="edge" marker-end="url(#a)" d="M300 516V552"/>
    <path class="edge" marker-end="url(#a)" d="M300 596V650"/>
    <path class="edge" marker-end="url(#a)" d="M300 720V756"/>
    <path class="edge" marker-end="url(#a)" d="M300 800V836"/>
    <path class="edge" marker-end="url(#a)" d="M300 880V916"/>
    <path class="edge" marker-end="url(#a)" d="M300 986V1022"/>

    <!-- edges, right column and merges -->
    <path class="edge" marker-end="url(#a)" d="M450 215H530"/>
    <path class="edge" marker-end="url(#a)" d="M450 481H530"/>
    <path class="edge" marker-end="url(#a)" d="M650 503V623H300"/>
    <path class="edge" marker-end="url(#a)" d="M450 685H530"/>
    <path class="edge" marker-end="url(#a)" d="M650 707V818H300"/>
    <path class="edge" marker-end="url(#a)" d="M450 951H530"/>

    <!-- labels -->
    <text class="lbl" x="326" y="272">yes</text>
    <text class="lbl" x="490" y="206">no</text>
    <text class="lbl" x="326" y="538">yes</text>
    <text class="lbl" x="490" y="472">no</text>
    <text class="lbl" x="326" y="742">yes</text>
    <text class="lbl" x="490" y="676">no</text>
    <text class="lbl" x="326" y="1008">yes</text>
    <text class="lbl" x="490" y="942">no</text>
  </svg>
</main>
</body>
</html>
